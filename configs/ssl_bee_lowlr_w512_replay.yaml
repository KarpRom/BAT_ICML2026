# ssl_bee_lowlr_w512.yaml + replay: half of every epoch drawn from a second corpus (AudioSet,
# BAT's original data, passed as REPLAY_DIR / --replay-dir) to limit forgetting. Without replay,
# the 512-frame run lost buzz F1 steadily with steps (25k: -0.021 vs BAT_base).
#
# dataset_dir, replay_dir and init_checkpoint are passed on the CLI by slurm/pretrain_bat.slurm.
#
# ==========================================
# System & Environment
# ==========================================
device: cuda
num_workers: 16
compile: true
state_save_path: null  # unused by ssl_trainer.py (it builds its own timestamped save path); kept null to match upstream
save_interval: 2500
replay_ratio: 0.5  # share of each epoch from replay_dir (fresh draw per epoch)
log_dir: logs/SSL_lowlr_w512_replay

# ==========================================
# Data & Features
# ==========================================
sr: 16000
n_fft: 1024
hop_length: 160
n_mels: 128
time_frame_size: 512  # 32 time patches x 8 freq patches = 256 tokens; a 5 s clip (501 frames) fills it

# ==========================================
# Model Architecture
# ==========================================
patch_size: 16
dim: 768
depth: 12
num_heads: 12
mlp_ratio: 4
decoder_depth: 6
decoder_heads: 12
decoder_mlp_ratio: 4
decoder_dim: 768

# ==========================================
# Training & Optimization
# ==========================================
# Same 24 clips per optimizer step and GPU as ssl_bee_lowlr.yaml (12 x 2 accumulation there),
# in one pass: the attention matrices that OOM'd at 1024 frames are 4x smaller at 512.
# If it still OOMs, go back to batch_size 12 + grad_accumulation_steps 2 (same optimization).
batch_size: 24
grad_accumulation_steps: 1
optimization_steps: 25000
lr: 5.0e-5
min_lr: 1.0e-6
lr_warmup_steps: 2500
weight_decay: 0.05
adam_beta1: 0.9
adam_beta2: 0.95
ema_warmup_steps: 25000
ema_decay_start: 0.9998
ema_decay_end: 0.99999
clip_norm: null  # gradient clip norm

# ==========================================
# Augmentation & Regularization
# ==========================================
mask_ratio: 0.8
num_views: 16
