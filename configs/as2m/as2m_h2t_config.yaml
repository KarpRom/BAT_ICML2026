# AS-2M: derived from configs/as20k/as20k_h2t_config.yaml (BAT author, GitHub issue: same template, AS-2M values
# from the paper's Appendix A, Table 7). Lines tagged TABLE7 still hold the AS-20k value: check them
# against Table 7 before the reproduction run. dataset_dir is passed on the CLI by scripts/xp.py.
# ==========================================
# System & Environment
# ==========================================
device: cuda
train_num_workers: 48
val_num_workers: 0
test_num_workers: 32
compile: true
state_save_path: null
save_model: false

# ==========================================
# Data & Features
# ==========================================
task: as2m
dataset_dir: null  # AudioSet root, on the CLI (--dataset-dir)
sr: 16000
n_fft: 1024
hop_length: 160
frame_length: 25.0  # legacy models used this
frame_shift: 10.0  # legacy models used this
n_mels: 128
f_min: 0
time_frame_size: 1024  # number of time frames after transforming the waveform into a spectrogram

# ==========================================
# Model Architecture
# ==========================================
model_name: BAT  # BAT, EAT, SSLAM, BEATs
pretrained_path: pretrained_states/BAT_base.pt
vit_size: null
patch_size: 16
dim: 768
depth: 12
num_heads: 12
mlp_ratio: 4
head: h2t
use_cls_in_head: true
num_prototypes: 0  # TABLE7
num_vqt: 0
frame_wise_task: false
head_norm: true
head_dropout: 0.2  # TABLE7

# ==========================================
# Training & Optimization
# ==========================================
finetune: false
train_batch_size: 48  # TABLE7
val_batch_size: 0
val_frequency: 0
test_frequency: 20000  # TABLE7
test_batch_size: 64
optimization_steps: 20000  # TABLE7
lr: 1.0e-3  # TABLE7
min_lr: 1.0e-6  # TABLE7
lr_layer_decay: null  # TABLE7
lr_warmup_steps: 500  # TABLE7
weight_decay: 0.05  # TABLE7
adam_beta1: 0.9
adam_beta2: 0.999
grad_accumulation_steps: 1
grad_clip_norm: null
use_asymmetric_loss: true

# ==========================================
# Augmentation & Regularization
# ==========================================
dropout: 0.0
path_dropout_rate: 0.0  # TABLE7
label_smoothing: null
lasso_weight: 0.0001
augment: false
use_mixup: false  # TABLE7
mixup_chance: 0  # TABLE7
mixup_beta: 0  # TABLE7
mixup_hard_label: false
use_random_gain: false
use_color_noise: false
color_noise_chance: 0
use_time_roll: false
use_tf_mask: false
freq_mask_param: 0  # TABLE7
time_mask_param: 0  # TABLE7
tf_mask_repeats: 0  # TABLE7
mask_ratio: 0.0
