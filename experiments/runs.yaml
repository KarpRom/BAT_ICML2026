# Every run of the project, for scripts/xp.py. Add runs here, then `python scripts/xp.py submit`.
# Rerunning `submit` is always safe: done and queued runs are skipped, stopped ones resume.
#
# Run fields:
#   name        unique; also the run directory (<root>/<name>) and the SLURM job name (xp_<name>)
#   kind        study | strong | report | pretrain | finetune
#   config      YAML config (pretrain / finetune)
#   init        bat_base (default) | run:<pretrain run> (its final_BAT_format.pt) | a checkpoint path | none
#   init_ema    true: with init run:..., use the EMA teacher weights instead of the student's
#   overrides   {cli_option: value} passed to pretrain.py / main.py (true -> bare flag)
#   depends_on  [runs] that must finish first (init/per_class_ap/study: run:... are added automatically)
#   seed        training seed (PYTHONHASHSEED; the code defaults to 32 when unset)
#   seeds       [a, b, ...]: expands into one run per seed, named <name>_s<seed>; `results` then
#               also prints mean ± std over <name>_s* and <name> (the latter counted as seed 32)
#   gpus, cpus_per_task, time, qos, account   SLURM resources (defaults per kind in scripts/xp.py)
#   chain       N: run as N chained 2 h jobs on the dev QOS instead of one `time` job
#   data_dir    dataset path if not the AudioSet default
#
# Paths may use environment variables ($WORK, $SCRATCH, $AUDIOSET...). Machine-specific ones
# (AUDIOSET, ...) are exported by env.sh: xp.py sources it before expanding this file, so the
# values are the same here and in the jobs whatever the login shell has.

settings:
  root: $SCRATCH/bat_runs                   # run directories (checkpoints are big: $SCRATCH)
  audioset: $AUDIOSET                       # AudioSet root (*_segments/, *_segments.csv, ontology.json),
                                            # exported by env.sh (xp.py reads it from there)
  bat_base: $HOME/.cache/bat_ssl/BAT_base.pt
  account: soz@h100
  cpu_account: soz@cpu
  env_script: env.sh                        # sourced by every job instead of the default module load;
                                            # relative to the repo root, not versioned (env.example.sh)

runs:
  # ---------------- Step 0: what is worth changing (CPU only)
  - name: study_audio                       # per-clip sample rate / bandwidth / time scales, full AudioSet
    kind: study
    num_shards: 50

  - name: study_strong                      # event durations + token merging from the strong labels
    kind: strong                            # needs: strong_label_stats.py download --dir $AUDIOSET/strong

  - name: study_report                      # report.md; delete it to regenerate (e.g. with per-class AP)
    kind: report
    study: run:study_audio
    strong_run: run:study_strong
    per_class_ap: run:bat_as2m_ft           # links properties to BAT's per-class AP (AS-2M finetune)

  # ---------------- Step 1: reproduce BAT. Paper (arXiv 2602.16305v2, Table 5), 18,886 eval clips:
  # finetune AS-2M 48.85 / AS-20k 41.59 mAP; CGP AS-2M 45.03 / AS-20k 37.70 mAP.
  #
  # Calibration first (keep reservations short): 400 steps + the full eval, to read the step rate
  # (it/s on the tqdm line of the log) and the eval time; then set `time` on the real runs below.
  - name: calib_as2m_ft                     # finetune speed: batch 96, the AS-2M recipe
    kind: finetune
    config: configs/as2m/as2m_finetune_config.yaml
    overrides: {optimization_steps: 400, lr_warmup_steps: 40}
    time: "00:30:00"

  - name: calib_as20k_cgp                   # frozen-backbone probe speed: batch 48
    kind: finetune
    config: configs/as20k/as20k_cgp_config.yaml
    overrides: {optimization_steps: 400, lr_warmup_steps: 40}
    time: "00:20:00"

  # `time` from the calibration (2026-10-29, H100, bf16 + compile): finetune batch 96 at 8.57 it/s,
  # CGP batch 48 at 31 it/s, eval of the 18,886 clips ~25 s, ~2 min startup. ~25% margin on top.
  - name: bat_as20k_ft                      # 40k steps, batch 48: ~12-16 it/s (extrapolated) -> ~50 min
    kind: finetune
    config: configs/as20k/as20k_finetune_config.yaml
    time: "01:15:00"

  - name: bat_as20k_cgp                     # 20k steps at 31 it/s -> ~11 min
    kind: finetune
    config: configs/as20k/as20k_cgp_config.yaml
    time: "00:25:00"

  # Seed spread of the AS-20k references (seed 32 = the runs above): tells whether the -0.4 mAP
  # gap to the paper is noise, and the smallest difference between variants worth believing.
  # Measured: finetune 14.1 it/s (40k steps ~47 min), CGP 24 it/s (20k steps ~14 min).
  - name: bat_as20k_ft
    seeds: [33, 34]
    kind: finetune
    config: configs/as20k/as20k_finetune_config.yaml
    time: "01:05:00"

  - name: bat_as20k_cgp
    seeds: [33, 34]
    kind: finetune
    config: configs/as20k/as20k_cgp_config.yaml
    time: "00:25:00"

  - name: bat_as2m_ft                       # 200k steps at 8.57 it/s -> 6.5 h; saves the finetuned weights
    kind: finetune
    config: configs/as2m/as2m_finetune_config.yaml
    overrides: {save_interval: 10000}       # ~20 min lost at most on a timeout, fewer 1 GB writes
    time: "08:15:00"

  - name: bat_as2m_cgp                      # paper: 45.03; 200k steps, batch 96 (~2x the as20k CGP step) -> ~3.6 h
    kind: finetune
    config: configs/as2m/as2m_cgp_config.yaml
    overrides: {save_interval: 10000}
    time: "04:30:00"

  # ---------------- Approaches: continued pretraining from BAT_base.pt, evaluated on AS-20k.
  # C0-cont = the control (no change, same steps); every variant is compared to it, not to
  # BAT_base. 1 GPU, 24 clips x 16 views per step (configs/ssl_as2m_continue.yaml).
  #
  # Calibration first: 600 steps at 10 s (never run at 1024 frames with SDPA yet): read the it/s
  # on the "SSL Pretraining" tqdm line and the peak memory, then set c0_cont's `time`.
  # The first job also lists the 1.9M wavs (~5 min); later runs reuse <root>/_cache.
  - name: calib_c0_cont
    kind: pretrain
    config: configs/ssl_as2m_continue.yaml
    gpus: 1
    overrides: {optimization_steps: 600, lr_warmup_steps: 60}
    time: "00:40:00"

  # calib_c0_cont (2026-10-29): 3.0 it/s at 10 s, batch 24 x 16 views, no OOM; 1.9M-file
  # listing + startup ~45 s. 25k steps -> 2h20 + checkpoints every 2500 steps.
  - name: c0_cont
    kind: pretrain
    config: configs/ssl_as2m_continue.yaml
    gpus: 1
    depends_on: [calib_c0_cont]
    time: "02:50:00"

  - name: c0_cont_as20k_cgp                 # student weights (final_BAT_format.pt)
    kind: finetune
    config: configs/as20k/as20k_cgp_config.yaml
    init: run:c0_cont
    time: "00:25:00"

  - name: c0_cont_ema_as20k_cgp             # EMA teacher weights: which of the two to keep
    kind: finetune
    config: configs/as20k/as20k_cgp_config.yaml
    init: run:c0_cont
    init_ema: true
    time: "00:25:00"

  - name: c0_cont_as20k_ft
    kind: finetune
    config: configs/as20k/as20k_finetune_config.yaml
    init: run:c0_cont
    time: "01:05:00"
